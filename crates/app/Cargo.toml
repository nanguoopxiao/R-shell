[package]
name = "shell-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
gtk-ui = ["dep:gtk4", "shell-renderer/gtk"]

[dependencies]
anyhow.workspace = true
dirs-next.workspace = true
gtk4 = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
shell-core = { path = "../core" }
shell-platform = { path = "../platform" }
shell-protocol = { path = "../protocol" }
shell-renderer = { path = "../renderer" }
shell-storage = { path = "../storage" }
shell-terminal = { path = "../terminal" }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
