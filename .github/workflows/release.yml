name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-gtk:
    name: Windows GTK slim package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install MSYS2 dependencies
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            base-devel
            bash
            ca-certificates
            coreutils
            curl
            findutils
            gawk
            gzip
            grep
            inetutils
            less
            openssh
            patch
            sed
            tar
            unzip
            wget
            xz
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gobject-introspection
            mingw-w64-x86_64-sassc
            mingw-w64-x86_64-python-docutils
            mingw-w64-x86_64-gi-docgen
            mingw-w64-x86_64-directx-headers

      - name: Build slim GTK runtime and package Windows GTK app
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: .\scripts\build-gtk-slim.ps1 -Package

      - name: Create release archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version -or $version -eq "main") {
            $version = "manual-${{ github.run_number }}"
          }
          $archive = "R-shell-windows-gtk-slim-$version.zip"
          Compress-Archive -Path "dist\windows-gtk-slim\*" -DestinationPath $archive -CompressionLevel Optimal -Force
          $hash = Get-FileHash -Algorithm SHA256 $archive
          "$($hash.Hash)  $archive" | Set-Content -Encoding ascii "$archive.sha256"
          "archive=$archive" >> $env:GITHUB_ENV

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $previousTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ($LASTEXITCODE -ne 0) {
            $previousTag = ""
          }

          if ($previousTag) {
            $commits = @(git log --pretty=format:"- %s (%h)" "$previousTag..HEAD")
          } else {
            $commits = @(git log --pretty=format:"- %s (%h)" -n 20 HEAD)
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to collect release commits.'
          }

          $notes = @(
            "## Changes",
            ""
          )
          if ($previousTag) {
            $notes += "Commit summary from $previousTag to $version:"
          } else {
            $notes += "No previous tag was found. Showing the latest 20 commits:"
          }
          $notes += ""
          if ($commits.Count -gt 0) {
            $notes += $commits
          } else {
            $notes += "- Initial release or no commits to list."
          }
          $notes += ""
          $notes += "## Downloads"
          $notes += ""
          $notes += "- $($env:archive): Windows GTK slim package"
          $notes += "- $($env:archive).sha256: SHA256 checksum"

          Set-Content -Encoding utf8 -Path release-notes.md -Value $notes

      - name: Remove previous release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            'X-GitHub-Api-Version' = "2022-11-28"
          }
          try {
            $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}"
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -eq 404) {
              Write-Host "No existing release assets to remove."
              return
            }
            throw
          }
          foreach ($asset in $release.assets) {
            Invoke-RestMethod -Headers $headers -Method Delete -Uri $asset.url
          }

      - name: Upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive }}
          path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256
          generate_release_notes: true
