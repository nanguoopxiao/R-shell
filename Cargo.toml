[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/core",
    "crates/platform",
    "crates/protocol",
    "crates/renderer",
    "crates/storage",
    "crates/terminal",
]
default-members = [
    "crates/app",
    "crates/core",
    "crates/platform",
    "crates/protocol",
    "crates/renderer",
    "crates/storage",
    "crates/terminal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["shell contributors"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
bitflags = "2"
dirs-next = "2"
gtk4 = { package = "gtk4", version = "0.10" }
keyring = "3"
pangocairo = "0.21"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
ssh2 = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
